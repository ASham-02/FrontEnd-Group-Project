<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./stylesheet.css" />
        <title>Document</title>
    </head>
    <body>
        <!-- Register form -->
        <div class="register-container">
            <h1 class="form-title">Register</h1>
            <button class="form-btn" id="loginBtn">Login</button>
            <form id="registerForm">
                <label for="username">Username</label>
                <input type="text" id="username" />
                <span class="error-message" id="usernameError"></span>
                <label for="email">Email</label>
                <input type="text" id="email" />
                <span class="error-message" id="emailError"></span>
                <label for="password">Password</label>
                <input type="password" id="password" />
                <span class="error-message" id="passwordError"></span>
                <input type="submit" value="Submit" />
            </form>
            <span class="successful-register" id="successfulRegister"></span>
        </div>
        <!-- end of register form -->

        <!-- Login form -->
        <div class="login-container">
            <h1 class="form-title">Login</h1>
            <button class="form-btn" id="registerBtn">Register</button>
            <form id="loginForm">
                <label for="loginUsername">Username</label>
                <input type="text" id="loginUsername" />
                <span class="error-message" id="loginUsernameError"></span>
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" />
                <span class="error-message" id="loginPasswordError"></span>
                <input type="submit" value="Submit" />
                <span class="login-message" id="loginMessage"></span>
            </form>
        </div>
        <!-- end of login form -->

        <div class="dashboard-container">
            <div class="dashboard-title">
                Welcome <span class="dashboard-username">User123</span>
            </div>
            <div class="logoutContainer">
                <button class="logout" id="logoutBtn">Log Out</button>
            </div>
        </div>

        <script src="./userScript.js" defer></script>
    </body>
</html>
